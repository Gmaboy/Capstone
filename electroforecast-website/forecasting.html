<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forecasting · GUIMPOWERCORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Michroma&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/theme.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
<script src="assets/js/chart-lite.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="shell-sidebar"></div>
  <div class="main">
    <div id="shell-topbar"></div>
    <div class="content" id="page-content">

      <div class="grid grid-12">
        <div class="card span-4">
          <div class="card-head"><h3>Model</h3><span id="forecastBadge"></span></div>
          <div id="forecastModelCard" class="text-sm text-muted">Loading…</div>
          <div class="divider"></div>
          <div class="card-head" style="margin-bottom:0;"><h3>Annual Peak Demand</h3></div>
          <div id="peakCard" class="text-sm text-muted">Loading…</div>
        </div>

        <div class="card span-8">
          <div class="card-head">
            <div><h3>Monthly Energy Forecast</h3><div class="card-sub" id="forecastSub">Loading…</div></div>
          </div>
          <div class="chart-box"><canvas id="chartForecast"></canvas></div>
          <div class="legend-row">
            <div class="legend-item"><span class="legend-swatch" style="background:#0C7983;"></span>Actual</div>
            <div class="legend-item"><span class="legend-swatch" style="background:#16A34A;"></span>Forecast</div>
            <div class="legend-item"><span class="legend-swatch" style="background:#C0D9DA;"></span>Upper / Lower 80%</div>
          </div>
        </div>
      </div>

      <div class="grid grid-12" style="margin-top:18px;">
        <div class="card span-12">
          <div class="card-head"><h3>Forecast Summary</h3><div class="card-sub">First 12 forecast months</div></div>
          <div class="table-wrap">
            <table>
              <thead><tr><th>Month</th><th>Forecast (MWh)</th><th>Lower 80%</th><th>Upper 80%</th></tr></thead>
              <tbody id="forecastRows"><tr><td colspan="4" class="text-muted">Loading…</td></tr></tbody>
            </table>
          </div>
        </div>
      </div>

    </div>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/shell.js"></script>
<script src="assets/js/analytics.js"></script>
<script>
ElectroShell.mount('forecasting', 'Forecasting', { dateRange:false });

(function () {
  const esc = ElectroAPI.escapeHTML;
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const label = r => `${MONTHS[r.month - 1]} ${String(r.year).slice(2)}`;
  const longLabel = r => `${MONTHS[r.month - 1]} ${r.year}`;
  const fixed = (v, d) => (v == null || !Number.isFinite(Number(v))) ? '—' : Number(v).toFixed(d);
  const mwh = v => fixed(v, 1);
  const mw = v => fixed(v, 2);
  const sparse = (rows) => { const step = Math.max(2, Math.ceil(rows.length / 12 / 2) * 2); return rows.map((r, i) => i % step === 0 ? label(r) : ''); };

  async function load() {
    const content = document.getElementById('page-content');
    const peakRequest = ElectroAPI.request('/api/forecast/peak').catch(error => ({ error }));
    try {
      const monthly = await ElectroAPI.request('/api/forecast/monthly');
      render(monthly);
    } catch (error) {
      if (error.status !== 404) ElectroAPI.notify(error.message, 'error');
      ElectroAnalytics.emptyState(content);
      return;
    }
    const peak = await peakRequest;
    if (peak.error) {
      if (peak.error.status !== 404) ElectroAPI.notify(peak.error.message, 'error');
      const msg = peak.error.status === 404 ? 'No trained model yet. Run python -m tools.model.train.' : 'Peak forecast unavailable.';
      document.getElementById('peakCard').innerHTML = `<div class="empty-mini">${esc(msg)}</div>`;
    } else {
      renderPeak(peak);
    }
    if (window.feather) feather.replace();
  }

  function renderPeak(peak) {
    document.getElementById('peakCard').innerHTML = peak.forecast.length
      ? peak.forecast.map(r => `<div style="margin-top:10px;">
          <div class="text-sm text-muted">${esc(r.year)} peak</div>
          <div class="h3">${esc(mw(r.peak_mw))} MW</div>
          <div class="text-sm text-muted">Load-factor range ${esc(mw(r.lo))} – ${esc(mw(r.hi))} MW</div>
        </div>`).join('') + `<div style="margin-top:10px;">${ElectroAnalytics.dataBadge(peak.data_source)}</div>`
      : '<div class="empty-mini">No peak forecast available.</div>';
  }

  function render(monthly) {
    const history = monthly.history.slice(-24);
    const forecast = monthly.forecast.slice(0, 24);
    if (!forecast.length) throw Object.assign(new Error('No forecast'), { status: 404 });
    const metrics = (monthly.model && monthly.model.metrics) || {};
    const labels = sparse([...history, ...forecast]);
    const pad = n => Array(n).fill(null);

    document.getElementById('forecastSub').textContent =
      `${longLabel(forecast[0])} – ${longLabel(forecast[forecast.length - 1])} · ${ElectroAPI.modelLabel(monthly.model.model_name)}`;
    document.getElementById('forecastBadge').innerHTML = ElectroAnalytics.dataBadge(monthly.data_source);

    const mape = Number.isFinite(metrics.mean_mape) ? `MAPE ${metrics.mean_mape.toFixed(1)}%` : 'MAPE —';
    let card = ElectroAnalytics.modelCard(monthly.model, 'Mean backtest', mape);
    if (metrics.beats_baseline === false) {
      card += '<div class="model-card-note">This model does not beat the seasonal-naive baseline.</div>';
    }
    document.getElementById('forecastModelCard').innerHTML = card;

    new Chart(document.getElementById('chartForecast'), {
      type:'line',
      data:{ labels,
        datasets:[
          { label:'Actual', data:[...history.map(r => r.energy_mwh), ...pad(forecast.length)], borderColor:'#0C7983', pointRadius:2, tension:.35 },
          { label:'Forecast', data:[...pad(history.length), ...forecast.map(r => r.forecast_mwh)], borderColor:'#16A34A', borderDash:[5,4], pointRadius:0, tension:.35 },
          { label:'Upper', data:[...pad(history.length), ...forecast.map(r => r.hi80)], borderColor:'rgba(192,217,218,.7)', pointRadius:0, fill:'+1', backgroundColor:'rgba(192,217,218,.35)', tension:.35 },
          { label:'Lower', data:[...pad(history.length), ...forecast.map(r => r.lo80)], borderColor:'rgba(192,217,218,.7)', pointRadius:0, tension:.35 }
        ]},
      options:{ plugins:{ legend:{ display:false } }, maintainAspectRatio:false }
    });

    document.getElementById('forecastRows').innerHTML = monthly.forecast.slice(0, 12).map(r =>
      `<tr><td>${esc(longLabel(r))}</td><td>${esc(mwh(r.forecast_mwh))}</td><td>${esc(mwh(r.lo80))}</td><td>${esc(mwh(r.hi80))}</td></tr>`
    ).join('');
    if (window.feather) feather.replace();
  }

  load();
})();
</script>
</body>
</html>
