<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Contributor Leaderboard · GUIMPOWERCORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="shell-sidebar"></div>
  <div class="main">
    <div id="shell-topbar"></div>
    <div class="content">

      <div class="card">
        <div class="card-head">
          <div><h3>Contributor Leaderboard</h3><div class="card-sub">Households ranked by admin-approved submissions (appliance ratings and bills)</div></div>
          <span class="data-badge crowdsourced">Crowdsourced</span>
        </div>

        <div class="podium" id="podium"></div>
        <div class="divider" id="podiumDivider" hidden></div>

        <div class="table-wrap">
          <table>
            <thead><tr><th>Rank</th><th>Contributor</th><th>Submissions</th><th>Approved</th><th>Approval rate</th><th>Joined</th></tr></thead>
            <tbody id="contributorRows"><tr><td colspan="6" class="text-muted">Loading…</td></tr></tbody>
          </table>
        </div>
        <div class="text-sm text-muted" style="margin-top:12px;">Names are shortened to first name and initial to protect household privacy.</div>
      </div>

    </div>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/shell.js"></script>
<script>
ElectroShell.mount('leaderboard', 'Contributor Leaderboard');

(function () {
  const esc = ElectroAPI.escapeHTML;
  const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const joined = ym => { const [y, m] = String(ym).split('-'); return MONTHS[Number(m) - 1] ? `${MONTHS[Number(m) - 1]} ${y}` : '—'; };

  function render(rows) {
    const body = document.getElementById('contributorRows');
    if (!rows.length) {
      body.innerHTML = '<tr><td colspan="6"><div class="empty-table"><i data-feather="users"></i><b>No contributors yet</b><span>Households appear here once they submit appliance ratings or bills.</span></div></td></tr>';
      return;
    }
    // Podium order: 2nd, 1st, 3rd.
    const slots = [[rows[1], 'silver', ''], [rows[0], 'gold', ' style="width:64px;height:64px;font-size:19px; border-color:#F5B93F;"'], [rows[2], 'bronze', '']];
    document.getElementById('podium').innerHTML = slots.filter(([r]) => r).map(([r, medal, big]) => `
      <div class="podium-slot">
        <div class="p-avatar"${big}>${esc(r.initials)}</div>
        <div class="p-name">${esc(r.name)}</div>
        <div class="p-score">${esc(r.approved)} approved</div>
        <div class="podium-bar ${medal}">${esc(r.rank)}</div>
      </div>`).join('');
    document.getElementById('podiumDivider').hidden = false;
    body.innerHTML = rows.map(r => `<tr>
      <td>${esc(r.rank)}</td>
      <td class="cell-user"><span class="mini-avatar">${esc(r.initials)}</span>${esc(r.name)}</td>
      <td>${esc(r.submissions)}</td><td>${esc(r.approved)}</td>
      <td>${esc(r.approval_rate.toFixed(1))}%</td><td>${esc(joined(r.joined))}</td></tr>`).join('');
  }

  ElectroAPI.request('/api/contributors').then(data => {
    render(data.contributors || []);
    if (window.feather) feather.replace();
  }).catch(error => {
    if (error.status === 401) { window.location.href = 'login.html'; return; }
    const msg = error.status === 403 ? 'Only admin, GUIMELCO staff, and researcher accounts can view contributors.' : 'Contributors are unavailable right now.';
    if (error.status !== 403) ElectroAPI.notify(error.message, 'error');
    document.getElementById('contributorRows').innerHTML = `<tr><td colspan="6" class="text-muted">${esc(msg)}</td></tr>`;
  });
})();
</script>
</body>
</html>
