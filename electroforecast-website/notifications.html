<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Notifications · GUIMPOWERCORE</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">
<script src="assets/js/theme.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/feather-icons/4.29.0/feather.min.js"></script>
</head>
<body>
<div class="app-shell">
  <div id="shell-sidebar"></div>
  <div class="main">
    <div id="shell-topbar"></div>
    <div class="content">

      <div class="card">
        <div class="card-head">
          <div><h3>Notifications</h3><div class="card-sub">Your 30 most recent notifications</div></div>
          <select id="notifFilter" aria-label="Filter notifications" style="width:auto; padding:6px 10px;"><option value="all">All</option><option value="unread">Unread</option></select>
        </div>
        <div id="notifList" class="text-sm text-muted">Loading…</div>
      </div>

    </div>
  </div>
</div>

<script src="assets/js/api.js"></script>
<script src="assets/js/shell.js"></script>
<script>
ElectroShell.mount('notifications', 'Notifications', { dateRange:false });

(function () {
  const esc = ElectroAPI.escapeHTML;
  const ICONS = {
    demand_alert: ['alert-triangle', 'var(--danger-bg)', 'var(--danger)'],
    submission_update: ['clipboard', 'var(--primary-50)', 'var(--primary)'],
    forecast_update: ['trending-up', 'var(--success-bg)', 'var(--success)'],
    report_ready: ['file-text', 'var(--warning-bg)', 'var(--warning)'],
    system: ['info', 'var(--grey-100)', 'var(--grey-600)']
  };
  let items = [];

  function render() {
    const unreadOnly = document.getElementById('notifFilter').value === 'unread';
    const shown = unreadOnly ? items.filter(n => !n.is_read) : items;
    const list = document.getElementById('notifList');
    if (!shown.length) {
      list.innerHTML = `<div class="empty-table"><i data-feather="bell-off"></i><b>${unreadOnly ? 'No unread notifications' : 'No notifications yet'}</b><span>You will be notified here when your submissions are reviewed.</span></div>`;
    } else {
      list.innerHTML = shown.map(n => {
        const [icon, bg, fg] = ICONS[n.type] || ICONS.system;
        const when = ElectroAPI.formatDate(String(n.created_at).replace(' ', 'T') + 'Z', { year:'numeric', month:'short', day:'numeric', hour:'numeric', minute:'2-digit' });
        return `<div class="notif-item">
          <div class="notif-icon" style="background:${bg}; color:${fg};"><i data-feather="${icon}"></i></div>
          <div style="flex:1;">
            <div class="notif-title">${esc(n.title)}${n.is_read ? '' : ' <span class="badge pending">New</span>'}</div>
            <div class="text-sm text-muted">${esc(n.message)}</div>
            <div class="notif-time">${esc(when)}</div>
          </div>
        </div>`;
      }).join('');
    }
    if (window.feather) feather.replace();
  }

  document.getElementById('notifFilter').addEventListener('change', render);
  ElectroAPI.request('/api/notifications').then(data => {
    items = data.notifications || [];
    render();
  }).catch(error => {
    if (error.status === 401) { window.location.href = 'login.html'; return; }
    ElectroAPI.notify(error.message, 'error');
    document.getElementById('notifList').innerHTML = '<div class="empty-mini">Notifications are unavailable right now.</div>';
  });
})();
</script>
</body>
</html>
